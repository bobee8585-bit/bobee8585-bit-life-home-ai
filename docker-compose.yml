services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lifehome
      POSTGRES_USER: lifehome
      POSTGRES_PASSWORD: lifehome_local
    ports:
      - "5432:5432"
    volumes:
      - lifehome-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehome -d lifehome"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - lifehome-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifehome-postgres:
  lifehome-redis:
